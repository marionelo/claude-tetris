<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="pause-menu hidden" role="dialog" aria-labelledby="pause-title">
      <div class="pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" id="resume-btn" class="pause-btn primary">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="pause-btn">Reiniciar</button>
        <button type="button" id="controls-btn" class="pause-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><span class="keys"><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span class="keys"><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span class="keys"><kbd>↓</kbd></span> bajar</li>
          <li><span class="keys"><kbd>Space</kbd></span> caída</li>
          <li><span class="keys"><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
        </ul>
        <div class="pause-level">
          <span id="start-level-label">Nivel inicial</span>
          <div class="stepper" role="group" aria-labelledby="start-level-label">
            <button type="button" id="level-dec" class="step-btn" aria-label="Bajar nivel inicial">−</button>
            <output id="start-level" aria-live="polite">1</output>
            <button type="button" id="level-inc" class="step-btn" aria-label="Subir nivel inicial">+</button>
          </div>
        </div>
        <p class="pause-hint">Se aplica en la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
